<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Champis — carte</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --border: #ddd; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e1e1e; --fg: #eee; --muted: #aaa; --border: #444; }
    }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1; width: 280px; max-width: calc(100vw - 20px);
      max-height: calc(100% - 20px); overflow: auto; box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    #panel.collapsed { padding: 6px 8px 6px 12px; }
    #panel.collapsed #panel-body { display: none; }
    #panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
    #panel.collapsed #panel-head { margin: 0; }
    #panel h1 { font-size: 16px; margin: 0; }
    #toggle {
      flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px;
      background: transparent; color: var(--fg); font-size: 16px; line-height: 28px; cursor: pointer;
    }
    #toggle:hover { background: rgba(127,127,127,.15); }
    #panel-body { margin-top: 8px; }
    #panel label { display: block; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
    #panel select, #panel input[type=range], #panel input[type=text] { width: 100%; box-sizing: border-box; }
    #weather-status { margin-top: 4px; font-size: 12px; color: var(--muted); }
    #drop {
      margin-top: 10px; padding: 14px 8px; border: 2px dashed var(--border); border-radius: 6px;
      text-align: center; color: var(--muted); font-size: 12px; cursor: pointer;
    }
    #drop.over { border-color: #4CA64C; color: var(--fg); }
    #drop input { display: none; }
    #legend { margin-top: 10px; display: grid; grid-template-columns: 16px 1fr; gap: 3px 8px; align-items: center; font-size: 12px; }
    #legend i { display: block; width: 16px; height: 14px; border-radius: 3px; }
    #status { margin-top: 8px; font-size: 12px; color: var(--muted); white-space: pre-line; }
    #probe {
      position: absolute; bottom: 24px; left: 10px; z-index: 1; padding: 6px 10px; font-size: 13px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <aside id="panel">
    <div id="panel-head">
      <h1>Champis</h1>
      <button id="toggle" type="button" aria-controls="panel-body" aria-expanded="true" title="Replier le panneau">▴</button>
    </div>
    <div id="panel-body">
    <label for="layer">Couche</label>
    <select id="layer" disabled><option>Aucune tuile chargée</option></select>
    <label for="basemap">Fond</label>
    <select id="basemap">
      <option value="plan">Plan IGN</option>
      <option value="ortho">Orthophoto IGN</option>
      <option value="osm">OpenStreetMap</option>
    </select>
    <label for="mode">Affichage</label>
    <select id="mode">
      <option value="T">Potentiel terrain T</option>
      <option value="S">Score du jour S = T × M_eff × Φ</option>
    </select>
    <div id="weather" hidden>
      <label for="api">API (<code>/weather/bbox</code>)</label>
      <input id="api" type="text" />
      <label for="day">Jour <span id="day-label"></span></label>
      <input id="day" type="range" min="-3" max="7" step="1" value="0" />
      <div id="weather-status"></div>
    </div>
    <label for="opacity">Opacité</label>
    <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.75" />
    <div id="drop">
      Glisser ici des <code>T-*.pmtiles</code> et le <code>A-*.pmtiles</code><br />(ou cliquer pour choisir)
      <input id="files" type="file" accept=".pmtiles" multiple />
    </div>
    <div id="legend"></div>
    <div id="status"></div>
    </div>
  </aside>
  <div id="probe"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <script src="app.js"></script>
</body>
</html>
