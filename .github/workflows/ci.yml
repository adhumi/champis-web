# CI du site : lint et tests (Python + node, sans réseau), configuration du serveur statique.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      # Le référentiel adhumi/champis est le sous-module champis/ ; tant qu'il est privé, le jeton
      # par défaut ne le lit pas : CHAMPIS_REFERENTIEL_TOKEN (jeton à granularité fine, lecture du
      # contenu de adhumi/champis). Une fois le dépôt public, le secret devient inutile.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CHAMPIS_REFERENTIEL_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --group dev --locked

      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (fonctions pures en node, décodeur PNG, identifiants des pages)
        run: uv run pytest

      - name: Configuration Caddy valide
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Railway ne récupère pas les sous-modules (build depuis un instantané sans .git) : la CI, qui a le
  # référentiel, déploie elle-même avec `railway up` après des tests verts sur main, ou à la main
  # (workflow_dispatch). RAILWAY_TOKEN : jeton de projet Railway (environnement production).
  deploy:
    needs: web
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-champis-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CHAMPIS_REFERENTIEL_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Railway CLI
        run: npm install -g @railway/cli

      # sans remote GitHub, la CLI envoie l'arbre de travail, sous-module compris
      - name: Déploiement (service champis-web)
        run: |
          git remote remove origin
          railway up --ci --service champis-web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
